version: '3.9'

services:
  app:
    build: .
    container_name: customer_support_ai_app

    ports:
      - '8000:8000'

    env_file:
      - .env

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - LOG_LEVEL=${LOG_LEVEL}
      - TICKET_PRIORITY_THRESHOLD=${TICKET_PRIORITY_THRESHOLD}
      - ESCALATION_CONFIDENCE_THRESHOLD=${ESCALATION_CONFIDENCE_THRESHOLD}

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

